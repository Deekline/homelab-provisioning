---
k3s_install_url: "https://get.k3s.io"

# Kubelet image GC thresholds (% of the node's root filesystem). The kubelet
# defaults (85/80) sit above what the Proxmox thin pool backing a worker's
# disk can actually supply, so unused images were never collected.
k3s_image_gc_high_threshold: 50
k3s_image_gc_low_threshold: 40
