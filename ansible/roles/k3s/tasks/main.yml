---
- name: Ensure k3s config drop-in directory exists
  file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    mode: '0755'
  tags: [k3s-config]

- name: Configure kubelet image GC thresholds
  copy:
    dest: /etc/rancher/k3s/config.yaml.d/10-image-gc.yaml
    content: |
      kubelet-arg:
        - "image-gc-high-threshold={{ k3s_image_gc_high_threshold }}"
        - "image-gc-low-threshold={{ k3s_image_gc_low_threshold }}"
    mode: '0644'
  notify: restart k3s
  tags: [k3s-config]

- include_tasks: init.yml
  when: k3s_role == 'init'

- include_tasks: server.yml
  when: k3s_role == 'server'

- include_tasks: agent.yml
  when: k3s_role == 'agent'

- name: Disable servicelb in k3s config (kube-vip handles service LB)
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      disable:
        - servicelb
    mode: '0644'
  when: k3s_role in ['init', 'server']
  notify: restart k3s
