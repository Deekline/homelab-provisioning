---
# Runs on localhost (Ansible controller). Kubeconfig written by the cilium role.
# ArgoCD -> Flux migration complete (2026-08-07) — this role now owns the
# sops-secrets-operator bootstrap prerequisites too (moved from the removed
# argocd role): sops-secrets-operator itself is installed by Flux's own
# HelmRelease (see flux/sops-operator.yaml in the infra repo) once this role
# gets Flux's controllers and root Kustomization running, but the operator's
# pod still needs the SOPS_AGE_KEY secret to exist beforehand or it
# crash-loops on first start — nothing else creates that secret, so it has
# to happen here.

- name: Fetch SOPS age key from 1Password
  command: op document get sops-age-key --vault="{{ op_vault }}"
  register: age_key_content
  no_log: true
  changed_when: false

- name: Write age key to temp file
  copy:
    content: "{{ age_key_content.stdout }}\n"
    dest: /tmp/sops-age-key-bootstrap.txt
    mode: '0600'
  no_log: true

- name: Create sops-secrets-operator namespace
  shell: kubectl create namespace sops-secrets-operator --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"
  changed_when: false

- name: Create sops age key secret in sops-secrets-operator namespace
  shell: |
    kubectl create secret generic sops-age-key \
      --from-file=keys.txt=/tmp/sops-age-key-bootstrap.txt \
      -n sops-secrets-operator \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"
  no_log: true
  changed_when: false

- name: Remove age key temp file
  file:
    path: /tmp/sops-age-key-bootstrap.txt
    state: absent

- name: Add Flux Helm repo
  shell: |
    helm repo add fluxcd-community https://fluxcd-community.github.io/helm-charts
    helm repo update fluxcd-community
  changed_when: false

- name: Install or upgrade Flux controllers
  shell: |
    helm upgrade --install flux2 fluxcd-community/flux2 \
      --version {{ flux_chart_version }} \
      -n flux-system \
      --create-namespace \
      -f {{ infra_dir }}/k3s/flux/values.yaml
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"

- name: Wait for Flux controllers to be ready
  shell: |
    kubectl wait --for=condition=available deployment \
      -n flux-system --all --timeout=300s
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"

- name: Create Gitea SSH credentials secret for Flux
  shell: |
    kubectl create secret generic gitea-deploy-key \
      --from-file=identity={{ flux_gitea_ssh_key_path }} \
      --from-literal=known_hosts="{{ gitea_ssh_host_key }}" \
      -n flux-system \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"
  no_log: true

- name: Apply Flux GitRepository and root Kustomization
  shell: |
    kubectl apply -f {{ infra_dir }}/flux/git-source.yaml
    kubectl apply -f {{ infra_dir }}/flux/root-kustomization.yaml
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"
